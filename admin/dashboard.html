<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Dashboard Admin | Nawasena Coffee</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./css/admin.css">
    <script type="module" src="./js/dashboard.js"></script>
  </head>
  <body class="admin-page">
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar" data-sidebar>
        <a class="admin-brand" href="/admin/dashboard" aria-label="Nawasena Coffee dashboard">
          <span class="admin-brand__mark" aria-hidden="true">N</span>
          <span>Nawasena Coffee</span>
        </a>
        <p class="admin-sidebar__label">WORKSPACE</p>
        <nav class="admin-nav" aria-label="Navigasi dashboard">
          <button class="admin-nav__item is-active" type="button" data-view="overview">Ringkasan</button>
          <button class="admin-nav__item" type="button" data-view="menu_items">Menu</button>
          <button class="admin-nav__item" type="button" data-view="gallery_items">Galeri</button>
          <button class="admin-nav__item" type="button" data-view="promotions_events">Promo &amp; Event</button>
          <button class="admin-nav__item" type="button" data-view="testimonials">Testimoni</button>
          <button class="admin-nav__item" type="button" data-view="store_settings">Informasi Toko</button>
          <button class="admin-nav__item" type="button" data-view="website_settings">Konten Website</button>
        </nav>
        <div class="admin-sidebar__bottom">
          <a class="admin-back-link" href="/" target="_blank" rel="noopener noreferrer">Lihat website ↗</a>
          <button class="admin-button admin-button--quiet" type="button" data-logout>Keluar</button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <button class="admin-button admin-button--quiet admin-menu-toggle" type="button" data-menu-toggle aria-controls="admin-sidebar" aria-expanded="false">
            Menu
          </button>
          <span class="admin-topbar__context">NAWASENA COFFEE / ADMIN</span>
          <span class="admin-user" data-admin-email></span>
        </header>
        <div class="admin-content">
          <div class="admin-message" data-dashboard-message role="status" aria-live="polite" hidden></div>
          <section data-dashboard-content aria-live="polite">
            <p class="admin-copy">Memuat dashboard...</p>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
